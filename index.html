    <!-- Fonts fetched in parallel with the stylesheet. An @import inside the CSS
         would queue the font request behind it and delay first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    />

    <title>Job Tracker Analytics</title>

    <!-- Resolves the theme before first paint so a dark-mode user never sees a
         white flash. Mirrors resolveTheme() in src/theme.js; kept inline and
         dependency-free because it must run ahead of the bundle. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("adil-job-tracker-theme");
          var pref = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref;
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
          if (resolved === "dark") {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#0b0e14");
          }
        } catch (e) {
          /* Blocked storage just means we fall through to the CSS default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
